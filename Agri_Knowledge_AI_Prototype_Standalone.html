<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef5f0;--card:#fff;--tx:#14261c;--mut:#587064;--bd:#d3e3da;--g:#3d8b6e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261e;--tx:#e8f0e9;--mut:#9db0a0;--bd:#2c3b2f}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,color-mix(in srgb,var(--g) 16%,var(--bg)) 0,var(--bg) 380px) no-repeat var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans Tamil","Noto Sans Devanagari",sans-serif}
.hero{background:linear-gradient(135deg,var(--g),color-mix(in srgb,var(--g) 55%,#000));color:#fff;padding:18px 16px 18px;margin-bottom:6px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px color-mix(in srgb,var(--g) 30%,transparent)}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:0}
.hero p{margin:4px 0 10px;font-size:13px;opacity:.92}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero select{width:auto;padding:6px 8px;background:#ffffff26;color:#fff;border-color:#ffffff55}
.hero select option{color:#000}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0}
.pill{background:#fff;color:var(--g);border:0;border-radius:99px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px;max-width:760px;margin:0 auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--g);border-color:var(--g);color:#fff}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px color-mix(in srgb,var(--g) 10%,transparent)}
h2{font-size:16px;margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
select,textarea,input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px;resize:vertical}
.btn{margin:10px 8px 0 0;padding:10px 16px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:color-mix(in srgb,var(--g) 15%,var(--card));color:var(--g)}
.btn:disabled{opacity:.6}
.out{white-space:pre-wrap;background:color-mix(in srgb,var(--g) 12%,var(--card));border-radius:10px;padding:10px;margin-top:10px;display:none}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.up{color:var(--g)}.dn{color:#c0392b}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--g) 15%,var(--card));color:var(--g)}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,var(--card))}
.cert{border:3px double var(--g);border-radius:12px;padding:20px 14px;text-align:center;background:var(--card);margin-top:10px}
.cert h3{margin:0;color:var(--g);font-size:20px;letter-spacing:1px}
.cert .nm{font-size:22px;font-weight:700;margin:8px 0}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 2px;text-align:center;box-shadow:0 2px 10px color-mix(in srgb,var(--g) 10%,transparent)}.tile b{display:block;font-size:20px;color:var(--g)}.tile span{font-size:11px;color:var(--mut)}.pv{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:10px}input[type=file]{padding:8px}
nav .ic{font-size:22px;line-height:1}nav .lb{font-size:12px;font-weight:700;line-height:1.15;text-align:center}.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}

<body>
<div class="hero"><div class="wrap">
  <div class="top"><h1>🌾 Agri Knowledge AI</h1><button class="pill" id="prof" onclick="openProfile()"></button></div>
  <p>AI tutors for everyone · human mentors for guidance · certificates for learners</p>
  <div class="ctl"><select id="lang" aria-label="Language"></select></div>
</div></div>
<nav id="nav"></nav>
<main id="app"></main>
<script>
/* Standalone shim: makes the app work in any browser (Chrome, Safari, Firefox, Edge, mobile).
   Inside Claude the real window.claude is used; everywhere else this provides the same API. */
(function(){
if(window.claude&&typeof window.claude.use==='function')return;
// ---- CONFIG: for production, point ENDPOINT to your own server that holds the API key ----
var CFG={ENDPOINT:'https://api.anthropic.com/v1/messages',MODEL:'claude-sonnet-5-5',MAX_TOKENS:1000};
function getKey(){
  var k='';try{k=localStorage.getItem('agri_apikey')||''}catch(e){}
  if(!k&&CFG.ENDPOINT.indexOf('anthropic.com')>-1){
    k=(prompt('Enter your Anthropic API key to enable AI (stored only in this browser):')||'').trim();
    if(k){try{localStorage.setItem('agri_apikey',k)}catch(e){}}
  }
  return k;
}
function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)})}
function call(prompt_,opts){
  opts=opts||{};var key=getKey();
  if(!key&&CFG.ENDPOINT.indexOf('anthropic.com')>-1){var e=new Error('no_key');e.code='no_key';return Promise.reject(e)}
  var imgs=(opts.images||[]);
  return Promise.all(imgs.map(function(b){return b64(b).then(function(d){return{type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:d}}})})).then(function(parts){
    parts.push({type:'text',text:prompt_});
    var h={'Content-Type':'application/json'};
    if(CFG.ENDPOINT.indexOf('anthropic.com')>-1){h['x-api-key']=key;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}
    return fetch(CFG.ENDPOINT,{method:'POST',headers:h,body:JSON.stringify({model:CFG.MODEL,max_tokens:CFG.MAX_TOKENS,messages:[{role:'user',content:parts}]})});
  }).then(function(r){
    if(r.status===401){try{localStorage.removeItem('agri_apikey')}catch(e){}}
    if(!r.ok){var e=new Error('http '+r.status);e.code='http_'+r.status;throw e}
    return r.json();
  }).then(function(j){
    var t=(j.content||[]).map(function(c){return c.text||''}).join('');
    if(opts.onText)opts.onText({text:t});
    return{text:t};
  });
}
function sample(p,o){return call(p,o)}
sample.json=function(p,o){return call(p,o).then(function(r){return JSON.parse(r.text.replace(/```json|```/g,'').trim())})};
var downloads={save:function(o){return new Promise(function(res){
  var blob=new Blob([o.data],{type:/\.html$/.test(o.filename)?'text/html':'text/plain'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();res()},500)})}};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,dictation=null;
if(SR){var rec=null,fin=[],st=[];
  dictation={onFinal:function(f){fin.push(f)},onState:function(f){st.push(f)},
   start:function(){return new Promise(function(res,rej){
     rec=new SR();rec.lang=(typeof LC!=='undefined'&&typeof LANGS!=='undefined'&&LC[LANGS.indexOf(document.getElementById('lang').value)])||'en-IN';
     rec.interimResults=false;
     rec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t)fin.forEach(function(f){f({text:t})})};
     rec.onstart=function(){st.forEach(function(f){f({state:'listening'})});res()};
     rec.onend=function(){st.forEach(function(f){f({state:'idle'})})};
     rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed')rej(e)};
     try{rec.start()}catch(e){rej(e)}})},
   stop:function(){try{rec&&rec.stop()}catch(e){}}};}
var svc={sample:sample,downloads:downloads,dictation:dictation};
window.claude={use:function(n){return Promise.resolve(svc[n])}};
})();
</script>
<script>
var LANGS=['Tamil (தமிழ்)','English','Hindi (हिन्दी)','Telugu (తెలుగు)','Kannada (ಕನ್ನಡ)','Malayalam (മലയാളം)','Marathi (मराठी)','Bengali (বাংলা)','Gujarati (ગુજરાતી)','Punjabi (ਪੰਜਾਬੀ)','Odia (ଓଡ଼ିଆ)','Urdu (اردو)'];
var THEMES={Green:'#3d8b6e'};
var PRICES=[['Tomato','₹24/kg','+₹2',1],['Onion','₹31/kg','−₹1',0],['Paddy','₹2,183/qtl','+₹0',1],['Banana','₹38/kg','+₹3',1]];
var SYS='You are Agri Knowledge AI, a friendly agricultural assistant for small farmers and students in India. Use simple words. Never invent exact pesticide doses; say to follow the product label and consult the nearest agriculture office for serious cases. ';
var tab='farmer',sample=null,downloads=null,me=null,quiz=null,pick=[],lastTopic='',lastLesson='',certs=[],qs=[];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ld(k,d){try{var v=localStorage.getItem('agri_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem('agri_'+k,JSON.stringify(v))}catch(e){}}
me=ld('me',null);certs=ld('certs',[]);qs=ld('qs',[]);
function L(){return $('lang').value}
$('lang').innerHTML=LANGS.map(function(l){return '<option>'+l+'</option>'}).join('');
$('lang').value=ld('lang','Tamil (தமிழ்)');
$('lang').onchange=function(){sv('lang',L())};
function theme(n){document.documentElement.style.setProperty('--g',THEMES[n]);sv('theme',n)}

theme('Green');
claude.use('sample').then(function(s){sample=s;render();processQueue()}).catch(function(){});
claude.use('downloads').then(function(d){downloads=d}).catch(function(){});
function ai(prompt,outId,btn,done){
  var o=$(outId);o.style.display='block';
  if(!navigator.onLine){var qq=ld('queue',[]);qq.push({p:prompt,l:L(),d:new Date().toISOString().slice(0,10)});sv('queue',qq);o.textContent='📴 You are offline. Your question is saved. AI will answer it automatically when internet returns (see Farm Tools → Offline guide).';return}
  if(!sample){o.textContent='AI is not available right now. Please reload the page.';return}
  btn.disabled=true;o.textContent='AI is thinking…';
  sample(SYS+'Reply in '+L()+'.\n\n'+prompt,{cache:false,onText:function(t){o.textContent=t.text}}).then(function(r){o.textContent=r.text;btn.disabled=false;if(done)done(r.text)}).catch(function(e){btn.disabled=false;o.textContent=(e&&e.code==='not_granted')?'AI permission was declined.':(e&&e.code==='no_key')?'API key needed to use AI. Tap the button again and enter your key.':(e&&e.code==='http_401')?'Invalid API key. Tap again to re-enter it.':'AI error, please try again.'});
}
function nav(){$('nav').innerHTML=[['farmer','🌾','Farmer'],['ftools','🧰','Farm Tools'],['student','🎓','Student'],['slab','🧪','Learn Lab'],['mentor','🧑‍🏫','Mentor']].map(function(r){return '<button class="'+(tab===r[0]?'on':'')+'" onclick="tab=\''+r[0]+'\';render()"><span class="ic">'+r[1]+'</span><span class="lb">'+r[2]+'</span></button>'}).join('');
  $('prof').textContent=me?('👤 '+me.name):'Sign in (optional)'}
function render(){nav();$('app').innerHTML=(sample?'':'<p class="mut">Connecting to AI…</p>')+offBanner()+dash()+(tab==='farmer'?farmer():tab==='ftools'?ftools():tab==='student'?student():tab==='slab'?slab():mentor())+'<p class="hint">Prototype: demo sign-in is stored only in this browser. AI answers are guidance, not a substitute for local agriculture officers.</p>'}
/* profile */
function openProfile(){
  var d=$('app');d.innerHTML='<div class="card"><h2>'+(me?'Your profile':'Sign in')+'</h2><p class="mut">Optional for farmers and students. Mentors sign in to answer questions.</p><label>Name</label><input id="pn" value="'+esc(me?me.name:'')+'"><label>I am a</label><select id="pr"><option value="student">Student</option><option value="farmer">Farmer</option><option value="mentor">Mentor</option></select><label>Expertise / interests (mentors)</label><input id="pe" value="'+esc(me?me.exp||'':'')+'" placeholder="e.g. Paddy, soil, drip irrigation"><button class="btn" onclick="saveProfile()">Save</button>'+(me?'<button class="btn alt" onclick="me=null;sv(\'me\',null);render()">Sign out</button>':'')+'<button class="btn alt" onclick="render()">Cancel</button></div>';
  if(me)$('pr').value=me.role}
function saveProfile(){var n=$('pn').value.trim();if(!n){alert('Enter your name.');return}me={name:n,role:$('pr').value,exp:$('pe').value.trim()};sv('me',me);tab=me.role;render()}
/* farmer */
function farmer(){
  var mine=qs.map(function(q,i){return {q:q,i:i}}).filter(function(x){return x.q.answer});
  return scanCard()+'<div class="card"><h2>🤖 AI crop doctor</h2><label>Crop</label><select id="crop"><option>Tomato</option><option>Paddy</option><option>Banana</option><option>Onion</option><option>Other</option></select><label>What are you seeing?</label><textarea id="txt" placeholder="e.g. brown spots on leaves after rain"></textarea><button class="btn" id="b1" onclick="diagnose(this)">Get AI guidance</button><div id="o1" class="out"></div><div id="after" style="display:none"><button class="btn alt" onclick="askMentor()">Ask a human mentor too</button></div></div>'+
  '<div class="card"><h2>🧑‍🏫 Mentor answers</h2>'+(mine.length?mine.map(function(x){return '<div class="row" style="display:block"><b>'+esc(x.q.crop)+'</b> · '+esc(x.q.text)+'<br><span class="tag">'+esc(x.q.mentor)+'</span> '+esc(x.q.answer)+'</div>'}).join(''):'<p class="mut">No mentor replies yet. Use “Ask a human mentor too” after an AI answer.</p>')+'</div>'+
  '<div class="card"><h2>📈 Market prices (sample data)</h2>'+PRICES.map(function(p){return '<div class="row"><span>'+p[0]+'</span><span><b>'+p[1]+'</b> <span class="'+(p[3]?'up':'dn')+'">'+p[2]+'</span></span></div>'}).join('')+'<label>Your crop</label><select id="mcrop">'+PRICES.map(function(p){return '<option>'+p[0]+'</option>'}).join('')+'</select><button class="btn" onclick="market(this)">Should I sell now?</button><div id="o2" class="out"></div></div>'+
  '<div class="card"><h2>🌦️ Weather &amp; water advice</h2><label>Your place and crop</label><input id="wp" placeholder="e.g. Madurai, paddy"><button class="btn" onclick="water(this)">Ask AI</button><div id="o3" class="out"></div><p class="mut">No live weather yet; AI gives general guidance.</p></div>';
}
function diagnose(b){var t=$('txt').value.trim();if(!t){alert('Please describe the problem.');return}var c=$('crop').value;
  ai('Crop: '+c+'\nProblem: '+t+'\nGive: 1) likely cause(s), 2) what to do today, 3) prevention, 4) when to contact the agriculture office. Max 150 words.','o1',b,function(){window._last={crop:c,text:t};$('after').style.display='block'})}
function askMentor(){if(!window._last)return;qs.push({crop:window._last.crop,text:window._last.text,from:me?me.name:'Anonymous farmer'});sv('qs',qs);window._last=null;$('after').innerHTML='<span class="tag">Sent to mentors ✓</span>'}
function market(b){var c=$('mcrop').value;ai('Sample prices: '+PRICES.map(function(p){return p.slice(0,3).join(' ')}).join('; ')+'.\nFarmer grows '+c+'. Say simply whether to sell now or wait (these are sample prices) and give 2 tips. Max 100 words.','o2',b)}
function water(b){var p=$('wp').value.trim();if(!p)return;ai('Farmer place and crop: '+p+'. Give water-saving and irrigation tips and weather risks to watch. Say you have no live weather. Max 120 words.','o3',b)}
/* dashboard + photo scan */
var photo=null,scanTxt='',scans=ld('scans',0);
function dashInner(){return [['📷',scans,'Photo scans'],['❓',qs.length,'Questions'],['🏅',certs.length,'Certificates'],['🌐',LANGS.length,'Languages']].map(function(t){return '<div class="tile"><i>'+t[0]+'</i><b>'+t[1]+'</b><span>'+t[2]+'</span></div>'}).join('')}
function dash(){return '<div id="dash" class="dash">'+dashInner()+'</div>'}
function scanCard(){return '<div class="card"><h2>📷 Photo scan</h2><p class="mut">Take a photo of the leaf, fruit or plant and ask AI.</p><input type="file" id="ph" accept="image/*" capture="environment" onchange="pickPhoto(this)">'+(photo?'<img class="pv" src="'+photo.url+'" alt="Selected crop photo">':'')+'<label>Your question (optional)</label><input id="pq" placeholder="e.g. Is this a disease? What should I spray?"><button class="btn" onclick="scan(this)">Ask AI about this photo</button><div id="o0" class="out"'+(scanTxt?' style="display:block"':'')+'>'+esc(scanTxt)+'</div><div id="after0" style="display:'+(scanTxt?'block':'none')+'"><button class="btn alt" onclick="askMentor0()">Ask a human mentor too</button></div></div>'}
function pickPhoto(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){photo={url:c.toDataURL('image/jpeg',0.8),blob:b};scanTxt='';render()},'image/jpeg',0.85)};im.src=r.result};r.readAsDataURL(f)}
function scan(b){if(!photo){alert('Take or choose a photo first.');return}var o=$('o0'),q=$('pq').value.trim();o.style.display='block';if(!sample){o.textContent='AI is not available right now. Please reload the page.';return}
  if(!navigator.onLine){o.textContent='📴 Offline: photo scan needs internet. Use the offline guide in Farm Tools, then try again online.';return}b.disabled=true;o.textContent='AI is looking at your photo…';
  sample(SYS+'Reply in '+L()+'.\n\nLook at this crop photo. Say: 1) crop and what you can see, 2) likely problem with confidence (low/medium/high), 3) what to do today, 4) prevention. If the photo is unclear, ask for a clearer one. '+(q?'Farmer asks: '+q:'')+' Max 150 words.',{images:[photo.blob],cache:false,onText:function(t){o.textContent=t.text}}).then(function(r){scanTxt=r.text;o.textContent=r.text;b.disabled=false;scans++;sv('scans',scans);$('dash').innerHTML=dashInner();window._q0=q;$('after0').style.display='block'}).catch(function(e){b.disabled=false;o.textContent=(e&&e.code==='not_granted')?'AI permission was declined.':'Photo analysis failed. Try a smaller or clearer photo.'})}
function askMentor0(){qs.push({crop:'Photo scan',text:(window._q0||'Please check this crop photo')+' — AI finding: '+scanTxt.slice(0,300),from:me?me.name:'Anonymous farmer'});sv('qs',qs);$('after0').innerHTML='<span class="tag">Sent to mentors ✓</span>'}
/* student */
function student(){
  var q='';
  if(quiz){q='<div class="card"><h2>📝 Quiz: '+esc(lastTopic)+'</h2>'+quiz.map(function(x,i){return '<p><b>'+(i+1)+'. '+esc(x.q)+'</b></p>'+x.options.map(function(o,j){return '<button class="opt'+(pick[i]===j?' sel':'')+'" onclick="pick['+i+']='+j+';render()">'+esc(o)+'</button>'}).join('')}).join('')+'<button class="btn" onclick="submitQuiz()">Submit quiz</button><div id="res"></div></div>'}
  return '<div class="card"><h2>📚 AI tutor</h2>'+(me?'':'<p class="mut">You can learn without signing in. Sign in (top right) to keep your certificates.</p>')+'<label>What do you want to learn?</label><input id="topic" placeholder="e.g. drip irrigation, soil health card"><button class="btn" onclick="tutor(this)">Teach me</button><div id="o4" class="out"></div><div id="qb" style="display:none"><button class="btn alt" onclick="makeQuiz(this)">Take quiz for certificate</button></div></div>'+q+
  '<div class="card"><h2>🏅 My certificates</h2>'+(certs.length?certs.map(function(c,i){return '<div class="row"><span><b>'+esc(c.topic)+'</b><br><span class="mut">'+esc(c.name)+' · '+c.date+' · '+c.score+'/3</span></span><button class="btn alt" style="margin:0" onclick="showCert('+i+')">View</button></div>'}).join(''):'<p class="mut">Pass a quiz (2 of 3 correct) to earn one.</p>')+'<div id="certbox"></div></div>'+
  '<div class="card"><h2>🧑‍🏫 Ask a mentor</h2><input id="mq" placeholder="Your question for a human mentor"><button class="btn" onclick="askMentorS()">Send</button><div id="ms"></div></div>';
}
function tutor(b){var t=$('topic').value.trim();if(!t)return;lastTopic=t;quiz=null;ai('Teach a student about "'+t+'" in farming: a short, clear lesson (max 150 words) with one real-life example.','o4',b,function(x){lastLesson=x;var l=ld('lessons',[]);l.push({t:lastTopic,x:x});sv('lessons',l.slice(-10));$('qb').style.display='block'})}
function makeQuiz(b){if(!sample)return;b.disabled=true;b.textContent='Preparing quiz…';

  if(b.textContent.indexOf('Stop')>-1)dict.stop();else dict.start().catch(function(){alert('Microphone permission was not given.')})}
